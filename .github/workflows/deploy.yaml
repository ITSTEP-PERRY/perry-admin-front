name: Run Perry Admin

on:
  push:
    branches:
      - main

permissions:
  id-token: write  # Required for requesting the JWT OIDC token
  contents: read   # Required for checkout actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Arcane CLI
        run: |
          curl -fsSL https://pkgs.getarcane.app/repository/raw/arcane-repo-signing.asc | sudo gpg --dearmor -o /usr/share/keyrings/arcane-archive-keyring.gpg
          
          sudo tee /etc/apt/sources.list.d/arcane.sources << 'EOF'
          Types: deb
          URIs: https://pkgs.getarcane.app/repository/debian/
          Suites: stable
          Components: main
          Signed-By: /usr/share/keyrings/arcane-archive-keyring.gpg
          EOF
          
          sudo apt update && sudo apt install arcane-cli
          
          arcane-cli --version

      - name: Debug GitHub OIDC
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+SET}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+SET}"
          arcane-cli --version
          arcane-cli auth federated --help

      - name: Authenticate and Deploy
        run: |
          arcane-cli auth federated \
            --provider github \
            --server https://arcane.smart-onion.com \
            --audience https://arcane.smart-onion.com \
            --export

          arcane-cli projects up PerryAdmin
