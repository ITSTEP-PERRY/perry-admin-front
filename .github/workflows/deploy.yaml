name: Test Arcane Federation

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Install Arcane CLI
        run: |
          curl -fsSL https://getarcane.app/install-cli.sh | sh
          echo "$HOME/.arcane/bin" >> "$GITHUB_PATH"

      - name: Check GitHub OIDC
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "GitHub OIDC is NOT available"
            exit 1
          fi

          echo "GitHub OIDC is available"

      - name: Authenticate with Arcane
        run: |
          eval "$(arcane-cli auth federated \
            --server https://arcane.smart-onion.com \
            --audience https://arcane.smart-onion.com \
            --provider github \
            --export)"

          echo "Arcane authentication successful"

      - name: Test API
        run: |
          arcane-cli projects list
